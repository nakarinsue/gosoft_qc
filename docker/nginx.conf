server {
    listen 80;
    server_name _;

    # --- 1. Optimization & Limits ---
    client_max_body_size 50M;
    
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --- 2. Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # --- 3. Frontend Location ---
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # SPA Routing
        try_files $uri $uri/ /index.html;

        # Cache Static Assets (เพิ่มเพื่อความเร็วในการโหลด)
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|otf|ttf|svg)$ {
            expires 6M;
            access_log off;
            add_header Cache-Control "public";
        }
    }

    # --- 4. Backend API Proxy ---
    location /API/ {
        # เปลี่ยน 'backends-test' เป็นชื่อ service ใน docker-compose.yml ของคุณ
        # การใส่ / ปิดท้ายจะทำหน้าที่ stripping path (ตัด /API/ ออก)
        proxy_pass http://localhost:8001/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Forward Headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout Settings (เพิ่มเป็น 300s สำหรับงาน Bulk Database ขนาดใหญ่)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Error Pages
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}